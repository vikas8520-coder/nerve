<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Hermes Agent logo - stylized H with neural network nodes -->
  <circle cx="16" cy="16" r="15" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="16" cy="16" r="15" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  
  <!-- Neural network nodes -->
  <circle cx="10" cy="10" r="2.5" fill="#8B5CF6"/>
  <circle cx="22" cy="10" r="2.5" fill="#8B5CF6"/>
  <circle cx="16" cy="16" r="3" fill="#8B5CF6"/>
  <circle cx="10" cy="22" r="2.5" fill="#8B5CF6"/>
  <circle cx="22" cy="22" r="2.5" fill="#8B5CF6"/>
  
  <!-- Connections between nodes -->
  <path d="M12.5 10 L13.5 13.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M19.5 10 L18.5 13.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M12.5 22 L13.5 18.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M19.5 22 L18.5 18.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M10 12.5 L13.5 13.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M22 12.5 L18.5 13.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M10 19.5 L13.5 18.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M22 19.5 L18.5 18.5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Central H letter -->
  <text x="16" y="18.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#8B5CF6">H</text>
